server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
            allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600
      default-filters:
        - name: RequestRateLimiter
          args:
            key-resolver: "#{@userOrIpKeyResolver}"
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            redis-rate-limiter.requestedTokens: 1
      routes:
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/auth/**, /api/users/**
        - id: emi-service
          uri: lb://EMI-SERVICE
          predicates:
            - Path=/api/emis/**
        - id: expense-service
          uri: lb://EXPENSE-SERVICE
          predicates:
            - Path=/api/expenses/**, /api/expense-categories/**
        - id: budget-service
          uri: lb://BUDGET-SERVICE
          predicates:
            - Path=/api/budgets/**
        - id: ai-agent-service
          uri: lb://AI-AGENT-SERVICE
          predicates:
            - Path=/api/recommendations/**, /api/ai/**
        - id: market-data-service
          uri: lb://MARKET-DATA-SERVICE
          predicates:
            - Path=/api/market/**
        - id: investment-service
          uri: lb://INVESTMENT-SERVICE
          predicates:
            - Path=/api/investments/**, /api/portfolio/**, /api/goals/**
        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/notifications/**
        # OpenAPI docs of each service, aggregated in the gateway's Swagger UI
        - id: user-service-docs
          uri: lb://USER-SERVICE
          predicates:
            - Path=/docs/user-service/v3/api-docs
          filters:
            - SetPath=/v3/api-docs
        - id: emi-service-docs
          uri: lb://EMI-SERVICE
          predicates:
            - Path=/docs/emi-service/v3/api-docs
          filters:
            - SetPath=/v3/api-docs
        - id: expense-service-docs
          uri: lb://EXPENSE-SERVICE
          predicates:
            - Path=/docs/expense-service/v3/api-docs
          filters:
            - SetPath=/v3/api-docs
        - id: budget-service-docs
          uri: lb://BUDGET-SERVICE
          predicates:
            - Path=/docs/budget-service/v3/api-docs
          filters:
            - SetPath=/v3/api-docs
        - id: ai-agent-service-docs
          uri: lb://AI-AGENT-SERVICE
          predicates:
            - Path=/docs/ai-agent-service/v3/api-docs
          filters:
            - SetPath=/v3/api-docs
        - id: market-data-service-docs
          uri: lb://MARKET-DATA-SERVICE
          predicates:
            - Path=/docs/market-data-service/v3/api-docs
          filters:
            - SetPath=/v3/api-docs
        - id: investment-service-docs
          uri: lb://INVESTMENT-SERVICE
          predicates:
            - Path=/docs/investment-service/v3/api-docs
          filters:
            - SetPath=/v3/api-docs
        - id: notification-service-docs
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/docs/notification-service/v3/api-docs
          filters:
            - SetPath=/v3/api-docs

budgetx:
  security:
    jwt-secret: ${JWT_SECRET}
    open-paths:
      - /api/auth/**
      - /swagger-ui.html
      - /swagger-ui/**
      - /v3/api-docs/**
      - /docs/*/v3/api-docs
      - /webjars/**
      - /actuator/health
    # Service-to-service endpoints (called via Feign); blocked from the outside.
    internal-paths:
      - /api/users/*/salary
      - /api/users/*/profile
      - /api/emis/total
      - /api/expenses/total
      - /api/budgets/summary

springdoc:
  swagger-ui:
    urls:
      - name: user-service
        url: /docs/user-service/v3/api-docs
      - name: emi-service
        url: /docs/emi-service/v3/api-docs
      - name: expense-service
        url: /docs/expense-service/v3/api-docs
      - name: budget-service
        url: /docs/budget-service/v3/api-docs
      - name: ai-agent-service
        url: /docs/ai-agent-service/v3/api-docs
      - name: market-data-service
        url: /docs/market-data-service/v3/api-docs
      - name: investment-service
        url: /docs/investment-service/v3/api-docs
      - name: notification-service
        url: /docs/notification-service/v3/api-docs

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
