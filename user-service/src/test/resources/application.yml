spring:
  application:
    name: user-service
  config:
    import: "optional:configserver:"
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:users;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop

eureka:
  client:
    enabled: false

jwt:
  secret: test-secret-that-is-at-least-32-characters-long
  access-token-expiry-minutes: 15
  refresh-token-expiry-days: 7
